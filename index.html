<div class="hero"><h1>ノジマウェイ テスト学習</h1><p>本番と同じ10問。本当の穴埋めは指書き、順番・複数項目は文字入力＋自己判定。</p><div class="chips"><span class="chip">原本メモ 第1巻</span><span class="chip">原本メモ 第2巻</span><span class="chip">原本メモ 第6巻</span><span class="chip">穴埋めは手書き</span></div></div>
<div class="note"><strong>＿＿の穴埋め問題</strong>は、1文字ずつ指で書いて「この1文字を確定」。<strong>順番を答える問題・複数項目をまとめて答える問題</strong>はキーボード入力し、正答例を見て最後に自分で○×判定します。</div>
<div class="box"><div class="ttl">出題する巻（複数選択OK）</div><div class="tabs"><button class="b" data-v="1">第1巻</button><button class="b" data-v="2">第2巻</button><button class="b off" disabled>第3巻</button><button class="b off" disabled>第4巻</button><button class="b off" disabled>第5巻</button><button class="b" data-v="6">第6巻</button></div><div class="volnote">選択はこの端末に保存され、次回アクセス時も自動復元されます。</div><div class="stats"><div class="s"><b id="st">0</b>対象問題</div><div class="s"><b id="sd">0</b>本番回数</div><div class="s"><b id="sr">—</b>平均点</div><div class="s"><b id="sw">—</b>最新点</div></div></div>
