const Q=[[1,"穴埋め","経営理念では、＿＿＿＿を提供・普及させていく。","GS4","GS4＝Goods, Soft, Support, Service, Solution。"],[1,"穴埋め","GS4は Goods, Soft, Support, Service, ＿＿＿＿ の5つ。","Solution","原本メモのGS4構成。"],[1,"穴埋め","五つの経営理念のうち、「社会に貢献する経営」「オープンで公正な経営」に続くのは「＿＿＿＿的で革新的な経営」。","独創","五つの経営理念の一つ。"],[1,"穴埋め","ユニーク・クオリティ・スピード・コストの中で、最も優先順位が高いのは＿＿＿＿。","ユニーク","「ノジマで商品を買う理由」になるから。"],[1,"穴埋め","人事ポリシー NOJIMA の「N」の意味は？","ナンバーワンであることを尊重","六段階グレードと結びつく人事ポリシー。"],[1,"穴埋め","人事ポリシー NOJIMA の「O」の意味は？","オープンで公正公平な評価とオープンなコミュニケーションを尊重","六段階グレードと結びつく人事ポリシー。"],[1,"穴埋め","人事ポリシー NOJIMA の「J」の意味は？","仕事を喜びとしていくことを尊重","六段階グレードと結びつく人事ポリシー。"],[1,"穴埋め","人事ポリシー NOJIMA の「I」の意味は？","組織や仕事を革新創造していくことを尊重","六段階グレードと結びつく人事ポリシー。"],[1,"穴埋め","人事ポリシー NOJIMA の「M」の意味は？","経営意識をもって育成できる従業員を尊重","六段階グレードと結びつく人事ポリシー。"],[1,"穴埋め","人事ポリシー NOJIMA の「A」の意味は？","困難な仕事でも努力して成し遂げる従業員を尊重","六段階グレードと結びつく人事ポリシー。"],[1,"穴埋め","目標を具体化する七つの問いは＿＿＿＿で考える。","5W2H","Why / Who / What / When / Where / How / How much。"],[1,"穴埋め","提案は「現状マイナス → ＿＿＿＿ → どうなる」で考える。","どうすれば","仮説を立てて具体的な案を出す。"],[1,"穴埋め","お給料は誰から貰っている？","一人一人のお客様","「お客様のために」だけでなく「お客様の立場で」考える。"],[1,"穴埋め","5Sの「整理」とは？","必要・不要を分け、いらないものを処分する","5Sの定義。"],[1,"穴埋め","5Sの「整頓」とは？","必要なものを誰でもすぐに取り出せるように整える","5Sの定義。"],[1,"穴埋め","5Sの「清掃」とは？","常に掃除をし、きれいにする","5Sの定義。"],[1,"穴埋め","5Sの「清潔」とは？","初期のきれいな状態を維持する","5Sの定義。"],[1,"穴埋め","5Sの「躾」とは？","整理・整頓・清掃・清潔を守り、習慣化する","5Sの定義。"],[1,"四字熟語","「臥薪嘗胆」の概要・重要なことは？","目的達成のために苦労と努力を重ねること","原本メモの定義。"],[1,"穴埋め","成果を生み出す四つのファクター「アタマ」とは？","行動の結果をしっかりと考え抜く","順番のメモはテアシ→アタマ→オナカ→ムネ（テアオム）。"],[1,"穴埋め","成果を生み出す四つのファクター「ムネ」とは？","人のためになにかをやってあげる気持ちを持つ","順番のメモはテアシ→アタマ→オナカ→ムネ（テアオム）。"],[1,"穴埋め","成果を生み出す四つのファクター「オナカ」とは？","失敗を恐れない勇気と失敗を認める勇気","順番のメモはテアシ→アタマ→オナカ→ムネ（テアオム）。"],[1,"穴埋め","成果を生み出す四つのファクター「テアシ」とは？","行動をする","順番のメモはテアシ→アタマ→オナカ→ムネ（テアオム）。"],[1,"穴埋め","四人の部屋で最も育てやすい順番は？","A君→D君→B君→C君","原本メモの育てやすさ。"],[1,"穴埋め","ノジマ流品揃えは＿＿＿＿で考える。","TPOS","Time / Place / Occasion / Style。"],[2,"穴埋め","寿司屋の挨拶の教訓。「声をかけられたら＿＿＿＿」。","負け","従業員から積極的に挨拶・お声がけをする。"],[2,"穴埋め","テーブル＝購入にあたっての＿＿＿＿。","悩みごと","悩みごと＝お買い物の障害。"],[2,"穴埋め","AIDMAの順番を答える。","Attention→Interest→Desire→Memory→Action","購買心理の流れ。"],[2,"穴埋め","AIDEESの順番を答える。","Attention→Interest→Desire→Experience→Enthusiasm→Share","よりノジマにフィットする販売行動。"],[2,"穴埋め","AIDEESで一番のカギは＿＿＿＿（熱意・心酔）。","Enthusiasm","熱意・心酔が一番のカギ。"],[2,"穴埋め","遅くまで販売する商品は＿＿＿＿品、早期に販売する商品は＿＿＿＿品。","OS品／SO品","原本メモの区分。"],[2,"穴埋め","「ちやほや」で一番に力を注ぐべき相手は＿＿＿＿。","お客様","原本メモの要点。"],[6,"穴埋め","お客様に対する行動クレド1は？","いらっしゃいませに笑顔と一言を添えたお出迎えをする","お客様に対する行動クレド。"],[6,"穴埋め","お客様に対する行動クレド2は？","声を掛けられたら負け、従業員からお声掛けをする","お客様に対する行動クレド。"],[6,"穴埋め","お客様に対する行動クレド3は？","お客様のお困りごとを解決するフィットコンサルをする","お客様に対する行動クレド。"],[6,"穴埋め","お客様に対する行動クレド4は？","名刺を渡し、使用後の満足まで責任をもって対応する","お客様に対する行動クレド。"],[6,"穴埋め","お客様に対する行動クレド5は？","送り出し時、お客様のお名前でお見送りをする","お客様に対する行動クレド。"],[6,"穴埋め","スピード、ユニーク、クオリティからプロセスを見直し、数字・会社や個人の成績表である＿＿＿＿＆コストにつなげる。","インカム","原本メモの並び。"],[6,"穴埋め","全員経営＝全員＿＿＿＿保有。","株式","経済的な幸福のため、努力次第で価値を上げられるというメモ。"],[6,"穴埋め","『木戸に立てかけし衣食住』の「木」は＿＿＿＿、「戸」は＿＿＿＿。","季節・気候／道楽（趣味）","会話の話題を覚える語呂。"],[6,"穴埋め","AIDEESの2番目のEは＿＿＿＿（熱意・心酔）。","Enthusiasm","顧客をファン化することにつながる。"],[6,"四字熟語","「君子豹変」の概要・重要なことは？","情報をオープンにし、都合の悪い情報や耳の痛い意見も受け止め、直ちに根本から変われる人・組織・会社になる","「君子は豹変す。小人は面を革む。」。"],[6,"四字熟語","「絶体絶命」の教訓は？","どんな窮地でも必ず突破する道はある","金貸しのサメと娘の知恵の話。"],[6,"穴埋め","「気づく人」は、知っているよりも＿＿＿＿ことを重視する。","気づく","1週間に5つの気づき。"],[6,"穴埋め","決裁書は個人を成長させるための「＿＿＿＿ツール」。","個人の成長","提案理由、実行方法・予算、得られるリターンを考える。"],[6,"穴埋め","BYODの項目で、協力会社と共有しレベルアップする考え方は＿＿＿＿主義ではなく連携すること。","自前","原本メモは「自前主義」「協力会社と共有、レベルアップ」。"],[6,"穴埋め","人事ポリシー M は＿＿＿＿。","Management","経営意識をもって育成できる従業員を尊重する。"],[6,"穴埋め","MODELの意味は＿＿＿＿。","手本","手本職としてやっていく。上になるほど自分を律する。"],[6,"穴埋め","OODAを順番に答える。","Observe→Orient→Decide→Act","観察→情勢判断→意思決定→行動。"],[6,"穴埋め","部下が納得しないときは「理解→了解→＿＿＿＿」を意識する。","納得","説得が無理ならコミットを引き出し、やり遂げてもらう。"],[6,"穴埋め","昇降格ではなく、ノジマウェイでは＿＿＿＿格の効果と表現する。","降昇","早めに降格、自ら降格。"],[6,"穴埋め","フェア・マネジメントで、ノジマではKPIとして＿＿＿＿を指標にする。","仮想受注額","原本メモのKPI。"],[6,"穴埋め","足りないのは＿＿＿＿コスト。","コミュニケーション","情報伝達・意思疎通にかかる時間や労力。"],[6,"穴埋め","会議で重要なのは「評すること」ではなく＿＿＿＿こと。","決する","会議は決めるために行う。"],[6,"四字熟語","「衆議独裁」の概要・重要なことは？","衆議＝議論は関係者全員で行い、独裁＝結論は責任者一人が判断する。参画の活発さと決定の迅速さを両立する","書面決議も活用。"],[1,"教訓","「人生を豊かにする種」の流れを答える。","思い→行動→習慣→人格→人生","思いの種を蒔き行動を刈り取り、行動→習慣→人格→人生へつながる。"],[1,"教訓","イチローの教訓で重要な2点は？","高い目標を掲げること／目標達成に向けて工夫と努力を重ねること","原本メモにある2点。"],[1,"教訓","「下手な鉄砲」の教訓は？","新しいことにチャレンジし、小さな試行錯誤を繰り返していくこと","挑戦と小さな試行錯誤を重ねる。"],[1,"教訓","「雑巾」の教訓は？","どうしたらできるのかを自分で考えて行動していく","依頼心ではなく、自分で方法を考えて行動する。"],[1,"教訓","「きこり」の教訓は？","常に目的を意識して、仕事のやり方や考え方を見直す","忙しさを理由に錆びた斧を使い続けない。"],[1,"教訓","「金魚」の教訓は？","新しい人が来たときは組織の成長のチャンス","新しい人の加入を成長機会と捉える。"],[1,"教訓","「無謀と有望」の違いは？","具体的な謀をもって臨むことで有望となる","ただやるのではなく、具体的な謀を持つ。"],[1,"教訓","「公平」と「公正」の違いは？","公平＝プロセス・成果にかかわらず平等。公正＝プロセス・成果によって正しく評価・処遇する","モチベーションのためには公正が重要。"],[1,"教訓","「出る杭は伸ばす」で大切なことは？","自己主張をしてくれるメンバーを大切にし、失敗したときは一緒に対策を考える","原本メモの要点。"],[1,"教訓","強い組織をつくる3要素を順番で答える。","人の目利き→国の仕置き→合戦大勝利","コミュニケーションが人の目利きにつながる。"],[1,"教訓","「朱色作戦」とは？","既存の人材をできるだけ濃くしておき、少数精鋭で行う","既存人材を濃くする考え方。"],[1,"教訓","「答えを言わないのがマネジャー」で重要なことは？","メンバー自身に答えを考えてもらい、気づきを促す質問をする","答えを与えるだけでなく気づかせる。"],[1,"教訓","「売価ありき」ではなく、何から考える？","顧客から考える","最後にコストを考える。"],[2,"教訓","声のかけ方の3ポイントは？","相手によって言葉を変える／疑問形で話しかける／お客様の関心事に話題を合わせる","原本メモの3点。"],[2,"教訓","「うるさいお客様」への基本スタンスは？","教えてもらうスタンスで臨み、相手がいいと思っている商品を早めに把握する","オピニオンリーダーになる可能性がある。"],[2,"教訓","「お知らせ」と「演出」の違いは？","お知らせ＝商品の事実をそのまま伝える。演出＝その事実の意味を伝える","事実だけでなく意味を伝える。"],[2,"教訓","ギブ＆テイクの「ギブ」の例を答える。","販促品・カタログ・名刺をプレゼントする／体験させる／親切にする／きびきび対応する／感謝を伝える","原本メモの例。"],[2,"教訓","「隣のパン屋」の教訓は？","お店は店の外から始まっており、マイナスのAttentionをなくすため店外のクリンリネスにも気を配る","店内だけでなく店外も対象。"],[2,"教訓","コミュニケーションコストとは？","メンバーが増えると人数分それぞれで増える、情報伝達・意思疎通にかかるコスト","人数が多いとコストが増えるため、積極的な報連相が必要。"],[2,"教訓","「二つのソウゾウリョク」とは？","想像力と創造力","本を読むことで身につけたとメモされている。"],[2,"教訓","「反復」と「継続」の違いは？","反復＝ずっと同じことをし続ける。継続＝受け継いで、さらに良くしていく","同じことを続けるだけでなく改善する。"],[2,"教訓","ウサギとカメの教訓は？","ウサギはカメに勝つこと、カメはゴールすることを目標にした。常に高い目標を掲げることが大事","目標の持ち方の違い。"],[2,"教訓","行動目標を達成する3ステップは？","目標をたくさん書き出す→絶対やるべき行動目標を3つに絞る→日々のスケジュールに組み込む","原本メモの3ステップ。"],[2,"教訓","「悪い時の貯金」とは？","失敗を貯金と捉え、反省・対策で次につなげる","失敗を次に活かす考え方。"],[2,"教訓","「鶯や 御前に出ても 同じ声」の教訓は？","裏表のない態度","相手によって態度を変えない。"],[6,"教訓","「独創の道」の教訓は？","同じ土俵ではなく違う土俵、質を重視していく","「僕の前に道はない／僕の後ろに道は出来る」とメモされている。"],[6,"教訓","ネームコーリングとは？","相手の名前をきちんと覚え、送り出し時にお客様のお名前でお見送りする","信頼感と自分自身の責任感が高まる。"],[6,"教訓","コンサルティングセールスとは？","質問から真のニーズを引き出し、お客様のニーズにぴったり合う商品を見つけて提案する","単に欲しい商品を出すだけではない。"],[6,"教訓","心酔した顧客への対応で重要なことは？","お客様に近づいて不満を丁寧に伺い、可能な限り対応する","不満は当社の問題点を教えてくれ、ストアブランド向上につながる。"],[6,"教訓","「裸の王様」で意見を聞くときの姿勢は？","都合の悪い情報や耳の痛い意見でも、和顔愛語で聞く","「思い切って伝えて良かった」と思ってもらう。"],[6,"教訓","「愚者は経験と慣習を過信する」の教訓は？","得意のやり方・会社の慣習・過去の成功体験を過信せず、自分で行って問題点を発見し、お客様や市場を観察する","新しい行動や挑戦、観察と歴史から学ぶ。"],[6,"教訓","「ヒラメ君」と対比される良い姿は？","自力で泳ぎ回りながら餌をとるマグロ君","上だけを見て待つヒラメ社員ではなく、自力で動く。"],[6,"教訓","「質問する子ども」で質問された側が取るべき姿勢は？","質問に感謝の言葉を伝える","質問によって自分の知識が一つ増える。「聞くは一時の恥、聞かぬは一生の恥」。"],[6,"教訓","「超・常識」の教訓は？","多くの人に理解されない事案や、みんなに反対されるくらいの事案に新しい道・画期的なビジネスチャンスがある","多数が賛成する案は平凡になりやすいというメモ。"],[6,"教訓","日報をすぐに書く理由は？","記憶が鮮明なうちに残すため。遅くても翌日午前中までに書く","嫌なこと・辛いことがあった日ほどすぐ書く。"],[6,"教訓","「反省と日報」で避けるべきことは？","失敗の無駄遣い","反省と今後の対策を具体的にする。"],[6,"教訓","差別化と差異化の違いは？","差別化＝同種の中で違いを出して優劣を際立たせる。差異化＝別軸の違いで特別な地位を確立する","まねできない差異化を目指す。"]];let V='all',M='learn',quiz=[],i=0,locked=false;const S=JSON.parse(localStorage.getItem('waytest-v1')||'{}'),save=()=>localStorage.setItem('waytest-v1',JSON.stringify(S)),N=x=>(x||'').toLowerCase().replace(/[\s　・、,。．\/／→＝=「」『』（）()]/g,'');
const F=()=>Q.filter(x=>V==='all'||String(x[0])===V),W=()=>Q.filter((x,j)=>{let s=S[key(x,j)];return s&&(s.ng||0)+(s.mid||0)>(s.ok||0)}),key=(x,j)=>x[0]+'-'+Q.indexOf(x);
function mark(x,r){let k=key(x);S[k]??={ok:0,ng:0,mid:0};S[k][r]++;save();stats()}function stats(){let a=F(),ids=new Set(a.map(x=>key(x))),ok=0,ng=0,d=0;Object.entries(S).forEach(([k,s])=>{if(ids.has(k)){ok+=s.ok||0;ng+=s.ng||0;d+=(s.ok||0)+(s.ng||0)+(s.mid||0)}});st.textContent=a.length;sd.textContent=d;sr.textContent=ok+ng?Math.round(ok/(ok+ng)*100)+'%':'—';sw.textContent=W().filter(x=>V==='all'||String(x[0])===V).length}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-v]').forEach(z=>z.classList.remove('on'));b.classList.add('on');V=b.dataset.v;render()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(z=>z.classList.remove('on'));b.classList.add('on');M=b.dataset.m;render()});
function render(){stats();if(M==='learn')learn();if(M==='fill')start(F().filter(x=>x[1]==='穴埋め'),'穴埋め');if(M==='lesson')start(F().filter(x=>x[1]!=='穴埋め'),'教訓・概要');if(M==='mock')setup();if(M==='weak')start(W().filter(x=>V==='all'||String(x[0])===V),'苦手復習')}
function learn(){app.innerHTML='<div class="box"><div class="ttl">学習カード</div><input id="sea" placeholder="キーワード検索（例：5S、君子豹変、AIDEES）"><div id="cards"></div></div>';let p=()=>{let k=sea.value.toLowerCase(),a=F().filter(x=>!k||(x[2]+x[3]+x[4]).toLowerCase().includes(k));cards.innerHTML=a.length?a.map((x,n)=>`<div class="card"><div class="meta">原本メモ 第${x[0]}巻｜${x[1]}</div><div class="q">${x[2]}</div><div class="ans" id="a${n}"><b>答え：</b>${x[3]}<div class="exp">${x[4]}</div></div><div class="acts"><button class="b" onclick="document.getElementById('a${n}').classList.toggle('show')">答えを見る</button></div></div>`).join(''):'<div class="empty">該当なし</div>'};sea.oninput=p;p()}
function sh(a){return [...a].sort(()=>Math.random()-.5)}function start(a,t,c){if(!a.length){app.innerHTML='<div class="box empty">対象問題がありません。</div>';return}quiz=sh(a);if(c)quiz=quiz.slice(0,Math.min(c,quiz.length));i=0;show(t)}
function show(t){locked=false;let x=quiz[i],auto=x[1]==='穴埋め';app.innerHTML=`<div class="card"><div class="meta">${t}｜原本メモ 第${x[0]}巻｜${x[1]}｜${i+1}/${quiz.length}</div><div class="prog"><i style="width:${i/quiz.length*100}%"></i></div><div class="q">${x[2]}</div>${auto?'<input id="in" placeholder="答えを入力"><div class="acts"><button class="pri" id="check">判定</button></div><div id="fb"></div>':'<div class="acts"><button class="pri" id="rev">答え・要点を見る</button></div>'}<div class="ans" id="an"><b>答え：</b>${x[3]}<div class="exp">${x[4]}</div></div><div class="acts" id="grade" style="display:none"><button class="b" data-g="ok">できた</button><button class="b" data-g="mid">あやしい</button><button class="b" data-g="ng">できなかった</button></div><div class="acts" id="next" style="display:none"><button class="pri">${i+1===quiz.length?'完了':'次の問題'}</button></div></div>`;if(auto){let inp=document.getElementById('in'),ck=document.getElementById('check'),fbx=document.getElementById('fb'),anx=document.getElementById('an'),nx=document.getElementById('next');inp.focus();let c=()=>{if(locked||!inp.value.trim())return;locked=true;let ok=N(inp.value)===N(x[3]);mark(x,ok?'ok':'ng');fbx.className=ok?'good':'bad';fbx.textContent=ok?'○ 正解！':'× 正解を確認しよう';anx.classList.add('show');nx.style.display='flex'};ck.onclick=c;inp.onkeydown=e=>e.key==='Enter'&&c()}else{let rv=document.getElementById('rev'),anx=document.getElementById('an'),gr=document.getElementById('grade'),nx=document.getElementById('next');rv.onclick=()=>{anx.classList.add('show');gr.style.display='flex'};document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;mark(x,b.dataset.g);gr.style.display='none';nx.style.display='flex'})}document.getElementById('next').onclick=()=>{if(++i<quiz.length)show(t);else app.innerHTML=`<div class="box"><div class="ttl">${t} 完了</div><div class="q">全${quiz.length}問を完了しました。</div><div class="exp">間違い・あやしい問題は苦手復習に残ります。</div><div class="acts"><button class="pri" onclick="render()">もう一度</button></div></div>`}}
function setup(){let n=F().length;app.innerHTML=`<div class="box"><div class="ttl">模擬テスト</div><div class="exp">選択中の巻からランダム出題。</div><div class="acts"><button class="pri" onclick="start(F(),'模擬テスト',10)">10問</button><button class="b" onclick="start(F(),'模擬テスト',20)">20問</button><button class="b" onclick="start(F(),'模擬テスト',30)">30問</button><button class="b" onclick="start(F(),'模擬テスト',n)">全${n}問</button></div></div>`}render();
</script></body></html>
